# Windows 환경 Nginx 최적화: Windows에서는 worker_processes 1 필수
worker_processes  1;

error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;

    # 리버스 프록시 헤더 버퍼 크기 확장 (쿠키 및 대용량 응답 헤더로 인한 502 방지)
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Gzip 압축 설정 (정적 리소스 전송 최적화)
    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # WebSocket 연결 업그레이드 매핑
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # 1. HTTP (포트 80) -> HTTPS 자동 리다이렉트 및 ACME 갱신 챌린지 경로
    server {
        listen       80;
        server_name  pc.codingbot.kr 182.224.14.47 localhost "";

        # Let's Encrypt 인증서 자동 갱신 챌린지 경로
        location ^~ /.well-known/acme-challenge/ {
            root C:/nginx/html;
            default_type "text/plain";
            try_files $uri =404;
        }

        # IP나 도메인 상관없이 공식 HTTPS 도메인으로 안전하게 리다이렉트
        location / {
            return 301 https://pc.codingbot.kr$request_uri;
        }
    }

    # 2. HTTPS (포트 443) - SSL 보안 서버 및 리버스 프록시
    server {
        listen       443 ssl;
        server_name  pc.codingbot.kr 182.224.14.47 localhost "";

        # Let's Encrypt SSL 인증서 및 개인키 설정
        ssl_certificate      C:/nginx/ssl/pc.codingbot.kr-chain.pem;
        ssl_certificate_key  C:/nginx/ssl/pc.codingbot.kr-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # NAS 대용량 파일 업로드 지원 (용량 제한 해제)
        client_max_body_size 0;

        # ---------------------------------------------------------------
        # YuE2 음악 생성 스튜디오 (Suno 서브패스 리버스 프록시)
        # ---------------------------------------------------------------
        location = /suno {
            return 301 /suno/;
        }

        location /suno/ {
            proxy_pass http://127.0.0.1:7860/;

            # HTTP 1.1 및 WebSocket 지원
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # 프록시 헤더 설정
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Prefix /suno;

            # 대용량 오디오 업로드 (500MB)
            client_max_body_size 500M;

            # 오디오 생성 및 장시간 스트리밍 최적화 (버퍼링 비활성화, 타임아웃 1시간)
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            send_timeout 3600s;
        }

        # 프론트엔드 정적 빌드 파일 서빙 (SPA 지원)
        root E:/repos/NAS-with-Windows/client/dist;
        index index.html;

        # 프론트엔드 정적 에셋 직접 캐싱 서빙
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # 정적 아이콘
        location = /favicon.ico {
            try_files /vite.svg =204;
            access_log off;
        }

        location = /vite.svg {
            expires 7d;
            access_log off;
        }

        # Express 백엔드 API 리버스 프록시
        location /api/ {
            proxy_pass http://127.0.0.1:3001;

            # HTTP 1.1 및 지속 연결(Keep-Alive) 설정
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # 실제 클라이언트 IP 및 도메인 헤더 전달
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # 미디어 스트리밍 Range 헤더 보존
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;

            # 대용량 파일 업로드 및 비디오 스트리밍 버퍼링 지연 제거
            proxy_buffering off;
            proxy_request_buffering off;

            # 전송 타임아웃 넉넉하게 설정 (1시간)
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            send_timeout 3600s;
        }

        # SPA 클라이언트 사이드 라우팅 (index.html 직접 서빙 - AdGuard 프록시 주입 및 10초 대기 원천 차단)
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
