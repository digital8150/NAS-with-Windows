# Universal React NAS Engine - Nginx Reverse Proxy Configuration
# Windows Production Environment

worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log logs/access.log main;

    # Windows 호환 I/O 설정
    sendfile        off;
    tcp_nopush      off;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # NAS 대용량 파일 업로드 최적화
    client_max_body_size 0;             # 업로드 용량 무제한 (NAS 필수)
    client_body_buffer_size 1m;
    client_body_timeout 600s;

    # Windows Nginx 스트리밍 & 대용량 파일 전송 최적화 (디스크 임시 버퍼링 차단 및 무한로딩/용량불일치 방지)
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 86400s;          # 긴 스트리밍 및 다운로드 세션 유지
    proxy_send_timeout 86400s;
    proxy_connect_timeout 60s;

    # WebSocket 및 HTTP/1.1 업그레이드 매핑 (일반 요청 시 keep-alive 유지)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # 백엔드 Node.js Express 서비스 (포트 3001)
    upstream nas_backend {
        server 127.0.0.1:3001;
        keepalive 32;
    }

    # 1. HTTP 서버 (포트 80: IPv4 + IPv6 지원)
    server {
        listen       80;
        listen       [::]:80;
        server_name  localhost pc.codingbot.kr _;

        # 프론트엔드 정적 번들 직접 서빙 (고속 로딩 및 번들 지연 방지)
        location /assets/ {
            alias "F:/repos/NAS-with-Windows/client/dist/assets/";
            expires 30d;
            access_log off;
        }

        # 기본 리버스 프록시
        location / {
            proxy_pass http://nas_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 미디어 스트리밍 Range 헤더 보존
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
        }

        # 50x 에러 페이지
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    # 2. HTTPS 서버 (포트 443: IPv4 + IPv6 지원)
    server {
        listen       443 ssl;
        listen       [::]:443 ssl;
        server_name  localhost pc.codingbot.kr _;

        ssl_certificate      nas.crt;
        ssl_certificate_key  nas.key;

        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  1d;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # 프론트엔드 정적 번들 직접 서빙 (고속 로딩 및 번들 지연 방지)
        location /assets/ {
            alias "F:/repos/NAS-with-Windows/client/dist/assets/";
            expires 30d;
            access_log off;
        }

        # 기본 리버스 프록시
        location / {
            proxy_pass http://nas_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 미디어 스트리밍 Range 헤더 보존
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
        }

        # 50x 에러 페이지
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
